name: Sync Indriya content

# Captures real product images, names, prices and theme from www.indriya.com using a headless
# browser on a GitHub runner, then commits them to the branch. Run manually from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          # Install Playwright outside the project so the app's React peer-dependency tree is never resolved.
          npm i --prefix /tmp/pw playwright
          mkdir -p node_modules && ln -sfn /tmp/pw/node_modules/playwright node_modules/playwright
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture content from indriya.com
        run: node scripts/sync-indriya.mjs 2>&1 | tee sync.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-output
          path: |
            sync.log
            docs/reference
            src/data/generated
            assets/indriya
      - name: Commit results
        run: |
          git config user.name "indriya-sync[bot]"
          git config user.email "noreply@github.com"
          git add -A assets/indriya src/data/generated docs/reference
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: sync content from indriya.com"
          # The branch may have moved while this ran; integrate and retry.
          for i in 1 2 3; do git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && exit 0; sleep 3; done
          exit 1
